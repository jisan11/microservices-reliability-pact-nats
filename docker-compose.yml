
services:
  nats:
    image: nats:2.15.3-alpine
    container_name: nats-monografia
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped

volumes:
  nats_data:
